name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # The extension as a browser loads it, put together once from the open files, the hash-checked
  # wasm, onnxruntime-web at the version pnpm-lock.yaml pins and the hash-checked models of the
  # models release. The zip goes to the jobs after it as an artifact.
  assemble:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - id: version
        run: |
          version="$(jq -r .version manifest.json)"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match manifest version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: sh scripts/assemble.sh dist/neucap
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/package.js
      - uses: actions/upload-artifact@v4
        with:
          name: neucap-zip
          path: dist/neucap-*.zip
          compression-level: 0
          retention-days: 7

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome-for-testing, chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile --silent --config.strict-dep-builds=false
      - uses: actions/download-artifact@v4
        with:
          name: neucap-zip
          path: dist
      - run: unzip -q dist/neucap-*.zip -d dist/neucap
      # Ubuntu 24.04 forbids the unprivileged user namespaces Chrome's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - if: matrix.browser == 'chrome-for-testing'
        uses: browser-actions/setup-chrome@v2
        id: chrome-for-testing
      - if: matrix.browser == 'chrome-for-testing'
        run: echo "CHROME_PATH=${{ steps.chrome-for-testing.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - if: matrix.browser == 'chromium'
        uses: browser-actions/setup-chrome@v2
        id: chromium
        with:
          chrome-version: latest
      - if: matrix.browser == 'chromium'
        run: echo "CHROME_PATH=${{ steps.chromium.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - run: sh scripts/test-e2e.sh
        timeout-minutes: 15

  # Every push to main that passes the tests replaces the test-build pre-release: its tag and
  # release stay, each build replaces the zip and names its commit.
  test-build:
    runs-on: ubuntu-latest
    needs: [assemble, e2e]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: neucap-zip
          path: dist
      - run: |
          version="${{ needs.assemble.outputs.version }}"
          mv "dist/neucap-$version.zip" "dist/neucap-$version-test.zip"
      # Attestations of a private repository need GitHub Enterprise Cloud; a public one has them.
      - if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      - run: |
          if ! gh release view test-build >/dev/null 2>&1; then
            gh release create test-build dist/*.zip --prerelease --target "$GITHUB_SHA" --title "Test build ${{ needs.assemble.outputs.version }}" --notes "Built from $GITHUB_SHA."
            exit 0
          fi
          gh release upload test-build dist/*.zip --clobber
          for asset in $(gh release view test-build --json assets --jq '.assets[].name'); do
            case "$asset" in
              "$(basename dist/*.zip)") ;;
              *) gh release delete-asset test-build "$asset" --yes ;;
            esac
          done
          gh release edit test-build --prerelease --title "Test build ${{ needs.assemble.outputs.version }}" --notes "Built from $GITHUB_SHA."
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    runs-on: ubuntu-latest
    needs: [assemble, e2e]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: neucap-zip
          path: dist
      - if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      - run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
